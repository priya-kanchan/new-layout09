<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank You | Project Name Sector 63A Gurugram</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/webp" href="images/favicon.webp" />
    <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; position: relative; overflow: hidden; }
        .thanks { position: relative; z-index: 1; max-width: 600px; width: 100%; padding: 56px 40px; border-radius: 36px; text-align: center; }
        .thanks > img { width: 180px; margin: 0 auto 28px; }
        .thanks .eyebrow::after { content: ""; width: 28px; height: 2px; border-radius: 2px; background: var(--gold-line); }
        .thanks p:not(.eyebrow) { color: var(--text-soft); margin-bottom: 28px; }
        .tick { width: 72px; height: 72px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center;
            background: linear-gradient(180deg, #fde9d9, #f1c6a8); box-shadow: 0 0 40px rgba(240, 180, 140, .7); color: var(--ink); }
        @media (max-width: 600px) { .thanks { padding: 40px 20px; } }
    </style>
</head>
<body>
    <div class="grid-lines" aria-hidden="true"></div>
    <span class="orb orb-a" aria-hidden="true"></span>
    <span class="orb orb-b" aria-hidden="true"></span>
    <main class="thanks glass">
        <img src="images/logo-dummy.webp" alt="Logo" width="200" height="62" />
        <div class="tick" aria-hidden="true">
            <img src="images/icons/check-ink.webp" alt="" width="30" height="30" />
        </div>
        <p class="eyebrow">Enquiry Received</p>
        <h1 class="section-title">Thank You for Your Interest in Project Name</h1>
        <p>Our relationship manager will get in touch with you shortly with the price list, floor plans and site visit details.</p>
        <a href="index.html" class="btn btn-dark">Back to Home</a>
    </main>
</body>
</html>
